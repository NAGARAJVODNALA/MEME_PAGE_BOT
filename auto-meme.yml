name: Auto Meme Page Publisher
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      publish_to_ig:
        description: "Commit to GitHub and Publish to Instagram (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: meme-page-publisher
  cancel-in-progress: false

jobs:
  post-meme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade google-genai pillow edge-tts gtts
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run meme_agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLISH_TO_IG: ${{ github.event.inputs.publish_to_ig || 'true' }}
        run: python meme_agent.py
