name: Auto Meme Page Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'   # 9:00 AM EST
    - cron: '0 19 * * *'   # 2:00 PM EST
    - cron: '0 2 * * *'    # 9:00 PM EST

concurrency:
  group: meme-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-meme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow, Google GenAI & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install Pillow google-genai

      - name: Generate & Publish Page 1 V5 Studio Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python meme_agent.py
